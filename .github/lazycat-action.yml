version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/qmmusic.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: qmmusic

build:
  run_buildscript: false

images:
  # 主应用：上游 qmmusic/qm-music 有完整三段 SemVer tag 家族（v1.9.x ~ v2.5.0），排除 test-* 等别名
  - id: qmmusic
    target: service
    service: qmmusic
    source: qmmusic/qm-music
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: QM Music
    summary: "轻量级私有云音乐服务器"
